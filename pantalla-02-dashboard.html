<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UADEnet — Portal del Docente | Inicio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-950:#10192f;
    --navy-900:#1b2a4a;
    --navy-800:#26375c;
    --navy-600:#4a5c82;
    --navy-100:#e8ecf5;
    --gold-500:#c9a24b;
    --gold-600:#ab8437;
    --gold-100:#f4ead2;
    --bg:#f6f7fa;
    --surface:#ffffff;
    --text-900:#16213a;
    --text-600:#5b6472;
    --text-400:#8992a3;
    --border:#dde2ea;
    --error-600:#b3392c;
    --error-100:#fbeae7;
    --success-600:#2f7a4f;
    --success-100:#e7f4ec;
    --info-600:#3a5a99;
    --info-100:#eaf0fb;
    --radius-lg:16px;
    --radius-md:10px;
    --radius-sm:7px;
    --font-display:'Source Serif 4', Georgia, serif;
    --font-body:'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    --header-h:64px;
    --sidebar-w:248px;
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  /* Inicio debe renderizarse a la misma escala visual que el resto del portal. */
  html{}
  body{
    margin:0;
    font-family:var(--font-body);
    color:var(--text-900);
    background:var(--bg);
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;}
  a{color:inherit;}

  /* ============ HEADER ============ */
  .app-header{
    position:fixed;
    top:0;left:0;right:0;
    height:var(--header-h);
    background:var(--surface);
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 20px;
    z-index:50;
  }
  .header-left{display:flex;align-items:center;gap:14px;}

  .hamburger{
    display:none;
    background:none;border:none;cursor:pointer;
    width:36px;height:36px;
    align-items:center;justify-content:center;
    border-radius:8px;color:var(--navy-900);
  }
  .hamburger:hover{background:var(--navy-100);}

  .brand-mark{
    display:flex;align-items:center;gap:9px;
    background:none;border:none;cursor:pointer;padding:2px;
  }
  .brand-glyph{
    width:30px;height:30px;border-radius:7px;
    background:linear-gradient(155deg, var(--navy-900), var(--navy-950));
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .brand-glyph svg{width:16px;height:16px;}
  .brand-word{font-family:var(--font-display);font-weight:600;font-size:18.5px;color:var(--navy-950);white-space:nowrap;}
  .brand-word .accent{color:var(--gold-600);}

  .header-right{display:flex;align-items:center;gap:8px;}

  .icon-btn{
    position:relative;
    width:38px;height:38px;
    display:flex;align-items:center;justify-content:center;
    background:none;border:none;border-radius:9px;cursor:pointer;color:var(--navy-900);
  }
  .icon-btn:hover{background:var(--navy-100);}
  .icon-btn svg{width:19px;height:19px;}
  .badge-dot{
    position:absolute;top:6px;right:6px;
    width:8px;height:8px;border-radius:50%;
    background:var(--error-600);
    border:1.5px solid var(--surface);
  }

  .balance-chip{
    display:flex;align-items:center;gap:7px;
    background:var(--gold-100);
    border:1px solid rgba(201,162,75,0.4);
    border-radius:999px;
    padding:6px 12px 6px 10px;
    cursor:pointer;
    color:var(--navy-950);
  }
  .balance-chip:hover{background:#efe1bb;}
  .balance-chip svg{width:15px;height:15px;color:var(--gold-600);}
  .balance-chip .amount{font-size:13px;font-weight:700;}
  .balance-chip .label{font-size:11px;color:var(--text-600);font-weight:500;}

  .user-menu{
    display:flex;align-items:center;gap:9px;
    background:none;border:none;cursor:pointer;
    padding:4px 6px 4px 4px;border-radius:999px;
  }
  .user-menu:hover{background:var(--navy-100);}
  .avatar{
    width:32px;height:32px;border-radius:50%;
    background:var(--navy-900);color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-size:12.5px;font-weight:700;flex-shrink:0;
  }
  .user-meta{display:flex;flex-direction:column;line-height:1.25;text-align:left;}
  .user-meta .name{font-size:12.5px;font-weight:600;color:var(--text-900);}
  .user-meta .role{font-size:11px;color:var(--text-400);}
  @media (max-width:900px){.user-meta{display:none;} .balance-chip .label{display:none;}}

  /* ============ SIDEBAR ============ */
  .sidebar{
    position:fixed;
    top:var(--header-h);
    left:0;
    bottom:0;
    width:var(--sidebar-w);
    background:var(--surface);
    border-right:1px solid var(--border);
    overflow-y:auto;
    padding:16px 12px 20px;
    z-index:40;
    transition:transform .2s ease;
  }
  .nav-group{display:flex;flex-direction:column;gap:2px;margin-bottom:14px;}
  .nav-item{
    display:flex;align-items:center;gap:11px;
    padding:9px 12px;border-radius:9px;
    font-size:13.5px;font-weight:500;color:var(--text-600);
    text-decoration:none;cursor:pointer;border:none;background:none;width:100%;text-align:left;
  }
  .nav-item svg{width:18px;height:18px;flex-shrink:0;}
  .nav-item:hover{background:var(--navy-100);color:var(--navy-900);}
  .nav-item.active{background:var(--navy-900);color:#fff;font-weight:600;}
  .nav-divider{height:1px;background:var(--border);margin:10px 4px;}
  .nav-item.logout{color:var(--error-600);}
  .nav-item.logout:hover{background:var(--error-100);}

  .sidebar-backdrop{
    display:none;
    position:fixed;inset:0;top:var(--header-h);
    background:rgba(16,25,47,0.35);
    z-index:39;
  }

  /* ============ MAIN LAYOUT ============ */
  .app-body{padding-top:var(--header-h);}
  .main{
    margin-left:var(--sidebar-w);
    width:calc(100% - var(--sidebar-w));
    padding:28px 32px 60px;
    max-width:none;
  }
  .main > *{max-width:1320px;margin-left:auto;margin-right:auto;}

  .page-head{margin-bottom:24px;}
  .breadcrumb{font-size:12.5px;color:var(--text-400);margin:0 0 6px;font-weight:500;}
  .greeting{
    font-family:var(--font-display);
    font-size:27px;font-weight:600;color:var(--navy-950);margin:0 0 6px;
  }
  .greeting-sub{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .greeting-sub p{margin:0;font-size:14px;color:var(--text-600);}
  .today-chip{
    font-size:12px;color:var(--text-400);font-weight:500;
    background:var(--bg);border:1px solid var(--border);
    padding:3px 10px;border-radius:999px;text-transform:capitalize;
  }

  /* ============ SUMMARY CARDS ============ */
  .summary-grid{
    display:grid;grid-template-columns:minmax(0,1fr);gap:16px;margin-bottom:28px;
  }
  .summary-card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
    padding:18px 18px 16px;cursor:pointer;text-align:center;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;
    transition:border-color .15s ease, box-shadow .15s ease, transform .1s ease;
  }
  .summary-card:hover{border-color:var(--navy-600);box-shadow:0 8px 20px -12px rgba(16,25,47,0.25);transform:translateY(-1px);}
  .summary-card:focus-visible{outline:2px solid var(--navy-800);outline-offset:2px;}
  .summary-icon{
    width:38px;height:38px;border-radius:10px;
    display:flex;align-items:center;justify-content:center;
  }
  .summary-icon svg{width:19px;height:19px;}
  .summary-icon.blue{background:var(--navy-100);color:var(--navy-900);}
  .summary-icon.gold{background:var(--gold-100);color:var(--gold-600);}
  .summary-icon.info{background:var(--info-100);color:var(--info-600);}
  .summary-icon.warn{background:#fdf1e2;color:#a06a1a;}
  .summary-value{font-family:var(--font-display);font-size:26px;font-weight:600;color:var(--navy-950);}
  .summary-label{font-size:12.5px;color:var(--text-600);font-weight:500;}

  /* skeleton */
  .skel{background:linear-gradient(90deg,#eceef2 25%,#f4f5f8 37%,#eceef2 63%);background-size:400% 100%;animation:shimmer 1.4s ease infinite;border-radius:6px;}
  @keyframes shimmer{0%{background-position:100% 0;}100%{background-position:0 0;}}

  /* ============ TWO COLUMN SECTION ============ */
  .two-col{display:grid;grid-template-columns:1.35fr 1fr;gap:20px;margin-bottom:28px;align-items:start;}
  .two-col.single-panel{grid-template-columns:1fr;}
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;}
  .panel-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border);}
  .panel-title{font-size:15px;font-weight:700;color:var(--text-900);margin:0;}
  .panel-link{font-size:12.5px;font-weight:600;color:var(--navy-800);background:none;border:none;cursor:pointer;text-decoration:none;}
  .panel-link:hover{text-decoration:underline;}
  .panel-body{padding:14px 14px 16px;}

  /* activity item */
  .activity-item{
    display:flex;gap:12px;align-items:flex-start;
    padding:13px 10px;border-radius:10px;cursor:pointer;border:none;background:none;width:100%;text-align:left;
  }
  .activity-item:hover{background:var(--bg);}
  .activity-icon{
    width:38px;height:38px;border-radius:9px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
  }
  .activity-icon svg{width:18px;height:18px;}
  .activity-icon.exam{background:var(--error-100);color:var(--error-600);}
  .activity-icon.event{background:var(--info-100);color:var(--info-600);}
  .activity-main{flex:1;min-width:0;}
  .activity-top{display:flex;align-items:center;gap:8px;margin-bottom:2px;}
  .activity-type{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.03em;}
  .activity-type.exam{color:var(--error-600);}
  .activity-type.event{color:var(--info-600);}
  .activity-name{font-size:14px;font-weight:600;color:var(--text-900);margin:0 0 3px;}
  .activity-meta{font-size:12.5px;color:var(--text-600);}
  .activity-extra{font-size:12px;color:var(--text-400);margin-top:1px;}
  .chev{width:16px;height:16px;color:var(--text-400);flex-shrink:0;margin-top:8px;}

  /* notifications */
  .notif-item{
    display:flex;gap:12px;align-items:flex-start;
    padding:13px 10px;border-radius:10px;cursor:pointer;border:none;background:none;width:100%;text-align:left;position:relative;
  }
  .notif-item:hover{background:var(--bg);}
  .notif-item.unread{background:var(--navy-100);}
  .notif-item.unread:hover{background:#dfe5f2;}
  .notif-icon{
    width:38px;height:38px;border-radius:9px;flex-shrink:0;
    background:var(--gold-100);color:var(--gold-600);
    display:flex;align-items:center;justify-content:center;
  }
  .notif-icon svg{width:17px;height:17px;}
  .notif-main{flex:1;min-width:0;}
  .notif-title{font-size:13px;font-weight:700;color:var(--text-900);margin:0 0 2px;display:flex;align-items:center;gap:6px;}
  .unread-dot{width:7px;height:7px;border-radius:50%;background:var(--navy-900);flex-shrink:0;}
  .notif-desc{font-size:13px;color:var(--text-600);line-height:1.4;margin:0 0 4px;}
  .notif-time{font-size:11.5px;color:var(--text-400);}

  .badge{
    display:inline-flex;align-items:center;font-size:11px;font-weight:700;
    padding:3px 9px;border-radius:999px;text-transform:uppercase;letter-spacing:0.02em;
  }
  .badge.leido{background:var(--bg);color:var(--text-400);}
  .badge.noleido{background:var(--navy-900);color:#fff;}

  /* empty / error states */
  .empty-state, .error-state{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:34px 20px;gap:10px;
  }
  .empty-state svg, .error-state svg{width:34px;height:34px;color:var(--text-400);}
  .error-state svg{color:var(--error-600);}
  .empty-state p, .error-state p{margin:0;font-size:13px;color:var(--text-600);font-weight:500;}
  .retry-btn{
    font-size:12.5px;font-weight:600;color:#fff;background:var(--navy-900);
    border:none;border-radius:8px;padding:8px 16px;cursor:pointer;
  }
  .retry-btn:hover{background:var(--navy-800);}

  /* quick actions */
  .section-title{font-size:15px;font-weight:700;color:var(--text-900);margin:0 0 14px;}
  .quick-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
  .quick-card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);
    padding:12px 14px;text-align:center;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:10px;
    transition:border-color .15s ease, box-shadow .15s ease, transform .1s ease;
  }
  .quick-card:hover{border-color:var(--navy-800);box-shadow:0 8px 20px -12px rgba(16,25,47,0.25);transform:translateY(-1px);}
  .quick-card:focus-visible{outline:2px solid var(--navy-800);outline-offset:2px;}
  .quick-icon{
    width:36px;height:36px;border-radius:9px;background:var(--navy-900);color:#fff;
    display:flex;align-items:center;justify-content:center;
  }
  .quick-icon svg{width:18px;height:18px;}
  .quick-label{font-size:12.5px;font-weight:600;color:var(--text-900);line-height:1.3;}

  /* ============ STATE CONTROLS (review only) ============ */
  .state-controls{
    position:fixed;bottom:14px;left:calc(50% + var(--sidebar-w)/2);transform:translateX(-50%);
    z-index:60;display:flex;gap:6px;background:rgba(16,25,47,0.94);
    padding:8px;border-radius:10px;flex-wrap:wrap;justify-content:center;max-width:70vw;
  }
  .state-controls button{
    font-size:11.5px;font-weight:600;color:#e8ecf5;background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.14);border-radius:6px;padding:6px 10px;cursor:pointer;
  }
  .state-controls button:hover{background:rgba(255,255,255,0.18);}
  .state-controls span{font-size:10px;text-transform:uppercase;letter-spacing:0.06em;color:rgba(232,236,245,0.55);align-self:center;padding-right:2px;}

  /* ============ RESPONSIVE ============ */
  @media (max-width:1024px){
    .two-col{grid-template-columns:1fr;}
  }
  @media (max-width:900px){
    :root{--sidebar-w:0px;}
    .hamburger{display:flex;}
    .sidebar{
      width:264px;transform:translateX(-100%);
      box-shadow:0 0 0 rgba(0,0,0,0);
    }
    .sidebar.open{transform:translateX(0);box-shadow:16px 0 40px rgba(16,25,47,0.18);}
    .sidebar-backdrop.open{display:block;}
    .main{margin-left:0;width:100%;padding:22px 18px 90px;}
    .main > *{max-width:none;}
    .state-controls{left:50%;max-width:92vw;bottom:10px;}
  }
  @media (max-width:640px){
    .summary-grid{grid-template-columns:minmax(0,1fr);}
    .quick-grid{grid-template-columns:repeat(2,1fr);}
    .greeting{font-size:22px;}
  }
  @media (max-width:430px){
    .main{padding:18px 14px 90px;}
    .summary-grid{gap:10px;}
    .quick-grid{gap:10px;}
    .balance-chip .label{display:none;}
  }

.user-menu-wrap{position:relative;}
  .user-dropdown{display:none;position:absolute;top:calc(100% + 8px);right:0;width:220px;min-width:220px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);box-shadow:0 14px 34px -10px rgba(16,25,47,0.28);padding:6px;z-index:100;}
  .user-dropdown.open{display:flex;flex-direction:column;}
  .user-dropdown button{box-sizing:border-box;display:flex;align-items:center;justify-content:flex-start;gap:10px;width:100%;min-height:38px;text-align:left;padding:9px 10px;border-radius:8px;font-size:13px;line-height:1.2;font-weight:600;color:var(--text-900);background:none;border:none;cursor:pointer;}
  .user-dropdown button:hover{background:var(--navy-100);}
  .user-dropdown button.logout{color:var(--error-600);}
  .user-dropdown button.logout:hover{background:var(--error-100);}
  .user-dropdown button svg{width:16px !important;height:16px !important;max-width:16px;max-height:16px;color:var(--text-600);flex:0 0 16px;}
  .user-dropdown button.logout svg{color:var(--error-600);}
  .user-dropdown .dd-divider{height:1px;background:var(--border);margin:5px 4px;}

  

  /* ============ DASHBOARD ACTIVITIES ============ */
  .activities-list{display:flex;flex-direction:column;}
  .activity-item{display:flex;align-items:center;gap:12px;width:100%;padding:12px 4px;border:0;border-bottom:1px solid var(--border);background:none;text-align:left;cursor:pointer;color:inherit;}
  .activity-item:last-child{border-bottom:none;}
  .activity-item:hover{background:var(--navy-50,#f6f8fc);border-radius:10px;}
  /* Todas las actividades comparten exactamente el mismo tratamiento visual.
     La categoría se comunica por el texto, no por fondos/colores distintos. */
  .activity-icon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:0 0 38px;border:1px solid var(--border);background:var(--navy-50,#f6f8fc);color:var(--navy-700,#53627a);}
  .activity-icon.exam,.activity-icon.event,.activity-icon.feriado,.activity-icon.comedor{background:var(--navy-50,#f6f8fc);color:var(--navy-700,#53627a);border-color:var(--border);}
  .activity-icon svg{width:18px;height:18px;}
  .activity-main{min-width:0;flex:1;}
  .activity-top{display:block;margin-bottom:2px;}
  .activity-type{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--text-500,#778399);}
  .activity-type.exam,.activity-type.event,.activity-type.feriado,.activity-type.comedor{color:var(--text-500,#778399);}
  .activity-name{margin:0;color:var(--text-900);font-size:13.5px;font-weight:700;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .activity-meta,.activity-extra{margin:2px 0 0;color:var(--text-600);font-size:12px;line-height:1.25;}
  .activity-extra{color:var(--text-400);}
  .activity-item .chev{width:17px;height:17px;color:var(--text-400);flex:0 0 auto;}
  /* Mismo tratamiento que "Ver todas las notificaciones". */
  .activities-footer{padding:8px 20px 16px;border-top:1px solid var(--border);}
  .activities-all{border:0;background:none;padding:12px 0 0;color:var(--navy-800);font-size:12.5px;font-weight:600;cursor:pointer;text-align:left;}
  .activities-all:hover{text-decoration:underline;}

  /* Dashboard activity detail */
  .dashboard-modal-backdrop{position:fixed;inset:0;background:rgba(15,27,52,.42);display:none;align-items:center;justify-content:center;z-index:9999;padding:24px;}
  .dashboard-modal-backdrop.show{display:flex;}
  .dashboard-modal{width:min(620px,calc(100vw - 48px));max-height:min(760px,calc(100vh - 48px));overflow:auto;background:#fff;border:1px solid var(--border);border-radius:18px;box-shadow:0 24px 70px rgba(15,27,52,.24);}
  .dashboard-modal-head{display:flex;justify-content:space-between;gap:20px;padding:24px 26px 18px;border-bottom:1px solid var(--border);}
  .dashboard-modal-kicker{font-size:12px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;margin:0 0 6px;color:var(--text-500,#778399);}
  .dashboard-modal-kicker.exam,.dashboard-modal-kicker.event,.dashboard-modal-kicker.feriado,.dashboard-modal-kicker.comedor{color:var(--text-500,#778399);}
  .dashboard-modal-title{font-size:23px;line-height:1.25;font-weight:800;color:var(--text-900);margin:0;}
  .dashboard-modal-close{width:36px;height:36px;border:0;background:none;color:var(--text-500,#778399);cursor:pointer;border-radius:9px;flex:0 0 auto;}
  .dashboard-modal-close:hover{background:#f3f5f9;}
  .dashboard-modal-body{padding:8px 26px 20px;}
  .dashboard-modal-row{display:flex;justify-content:space-between;gap:24px;padding:15px 0;border-bottom:1px solid var(--border);}
  .dashboard-modal-row:last-child{border-bottom:0;}
  .dashboard-modal-row .lbl{font-size:14px;color:var(--text-600);font-weight:500;}
  .dashboard-modal-row .val{font-size:14px;color:var(--text-900);font-weight:700;text-align:right;}
  .dashboard-modal-footer{padding:16px 26px 24px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;}
  .dashboard-modal-footer .btn-primary{min-width:130px;}
  @media(max-width:700px){
    .dashboard-modal-backdrop{padding:12px}.dashboard-modal{width:100%;max-height:calc(100vh - 24px)}
    .dashboard-modal-head{padding:20px}.dashboard-modal-body{padding:8px 20px 16px}.dashboard-modal-footer{padding:14px 20px 20px}

  function dashCanonicalExamType(exam){
    const n=String(exam?.name||exam?.title||'').trim().toLowerCase();
    const t=String(exam?.type||exam?.tipo||'').trim().toLowerCase();
    if(t==='parcial1'||/parcial\s*1|primer\s+parcial/.test(n))return'parcial1';
    if(t==='parcial2'||/parcial\s*2|segundo\s+parcial/.test(n))return'parcial2';
    if(t==='recup1'||/recuperatorio.*parcial\s*1|recuperatorio.*primer\s+parcial/.test(n))return'recup1';
    if(t==='recup2'||/recuperatorio.*parcial\s*2|recuperatorio.*segundo\s+parcial/.test(n))return'recup2';
    if(t==='tp1'||/\btp\s*1\b/.test(n))return'tp1';
    if(t==='tp2'||/\btp\s*2\b/.test(n))return'tp2';
    if(t==='final'||/^final(?:\s+regular)?$/.test(n))return'final';
    return t||'parcial1';
  }
  function dashParseDate(str){

    if(!m)return'';
    const mi=DASH_MONTHS.indexOf(m[2].toLowerCase())+1;
    return mi?`${m[3]}-${String(mi).padStart(2,'0')}-${String(m[1]).padStart(2,'0')}`:'';
  }

    const d=new Date(iso+'T00:00:00');
    return `${d.getDate()} de ${DASH_MONTHS[d.getMonth()]} de ${d.getFullYear()}`;
  }
  function dashClock(ev){
    const raw=String(ev?.time||'').replace(/–/g,'-').trim();
    if(!raw)return'';
    const parts=raw.split('-').map(x=>x.trim());
    return parts.length>1?`${parts[0]}–${parts[1]}`:parts[0];
  }
  function dashBuildCalendarEvents(){
    const fixed=DASH_FIXED_EXAMS.map(e=>{
      const meta=DASH_COURSE_META[e.course]||{};
      const type=dashCanonicalExamType(e);
      return {...e,id:'fixed-exam-'+e.id,examSourceId:e.id,cat:'examen',
        dateISO:dashParseDate(e.date),date:e.date,time:e.time.split('–')[0].trim(),
        end:e.time.split('–')[1]?.trim()||'',name:DASH_TYPE_NAMES[type]||e.name,
        type,course:e.course,com:meta.com||'—',sede:meta.sede||'—',room:meta.room||'—',
        tipo:DASH_TYPE_NAMES[type]||e.name,title:`${DASH_TYPE_NAMES[type]||e.name} — ${e.course}`};
    });
    let session=[];
    try{session=JSON.parse(sessionStorage.getItem('uadenetSessionExams')||'[]')}catch(_ ){}
    let created=[];
    try{created=JSON.parse(sessionStorage.getItem('uadenetCreatedCourses')||'[]')}catch(_ ){}
    const dynamic=session.map((e,i)=>{
      const type=dashCanonicalExamType(e), name=DASH_TYPE_NAMES[type]||String(e.name||e.title||'Examen');
      const c=created.find(x=>String(x.id)===String(e.courseId)||x.name===e.course)||{};
      const meta=DASH_COURSE_META[e.course]||{};
      const iso=e.dateISO||dashParseDate(e.date);
      return {...e,id:'session-exam-'+(e.id??i),examSourceId:e.id,cat:'examen',
        dateISO:iso,date:iso,time:String(e.time||'').split('–')[0].trim(),
        end:String(e.time||'').split('–')[1]?.trim()||'',name,type,
        title:`${name} — ${e.course||''}`,course:e.course||'',
        com:e.com||c.com||c.comision||meta.com||'—',
        sede:e.location||c.sede||meta.sede||'—',
        room:e.room||c.room||c.aula||meta.room||'—',tipo:name};
    });
    return [...fixed,...dynamic,
      {id:'feriado-17',cat:'feriado',dateISO:'2026-08-17',date:'2026-08-17',time:null,end:null,title:'Feriado nacional',sub:'Sin actividades académicas'},
      {id:'reunion-docente',cat:'evento',dateISO:'2026-09-04',date:'2026-09-04',time:'15:00',end:'16:00',title:'Reunión docente',sub:'Sala de reuniones 2'},
      {id:'cierre-actas',cat:'evento',dateISO:'2026-08-31',date:'2026-08-31',time:'17:00',end:'18:00',title:'Cierre de actas',sub:'Evento académico'},
      {id:'almuerzo-01',cat:'comedor',dateISO:'2026-09-01',date:'2026-09-01',time:'12:00',end:'14:00',title:'Turno de comedor',sub:'Comedor central',ubicacion:'Belgrano'},
      {id:'almuerzo-02',cat:'comedor',dateISO:'2026-09-02',date:'2026-09-02',time:'12:00',end:'14:00',title:'Turno de comedor',sub:'Comedor central',ubicacion:'Monserrat'},
      {id:'jornada-innovacion',cat:'evento',dateISO:'2026-09-05',date:'2026-09-05',time:'10:00',end:'13:00',title:'Jornada de innovación',sub:'Campus UADEnet'}
    ];
  }
  function dashEventTimestamp(ev){
    const iso=ev.dateISO||dashParseDate(ev.date);
    if(!iso)return NaN;
    const t=ev.time||'12:00';
    const m=String(t).match(/\d{1,2}:\d{2}/);
    return new Date(iso+'T'+(m?m[0]:'12:00')+':00').getTime();
  }
  function dashLoadCancelledExamIds(){
    try{
      const raw=JSON.parse(sessionStorage.getItem('uadenetCancelledExams')||'[]');
      return new Set(Array.isArray(raw)?raw.map(String):[]);
    }catch(_){ return new Set(); }
  }
  function dashIsExamCancelled(ev,cancelledIds){
    if(!ev || ev.cat!=='examen') return false;
    const sourceId=ev.examSourceId!=null
      ? String(ev.examSourceId)
      : String(ev.id||'').replace(/^(?:fixed|session)-exam-/,'');
    return cancelledIds.has(sourceId)||cancelledIds.has(String(ev.id));
  }
  function dashPickActivities(){
    const now=Date.now();
    const cancelledIds=dashLoadCancelledExamIds();
    // IMPORTANTE: Inicio no mantiene una lista propia de 'próximas actividades'.
    // Reconstruye el mismo conjunto de eventos que alimenta Calendario académico,
    // incorpora los exámenes creados en la sesión y elimina los cancelados.
    // Luego toma SIEMPRE las cuatro actividades futuras más cercanas por fecha/hora,
    // sin priorizar exámenes, feriados, eventos académicos ni comedor.
    return dashBuildCalendarEvents()
      .filter(e=>Number.isFinite(dashEventTimestamp(e)) && dashEventTimestamp(e)>now && !dashIsExamCancelled(e,cancelledIds))
      .sort((a,b)=>dashEventTimestamp(a)-dashEventTimestamp(b))
      .slice(0,4);
  }
  function dashActivityIcon(cat){
    if(cat==='feriado')return '<svg viewBox="0 0 20 20" fill="none"><path d="M10 2.5L12 7L16.8 7.4L13.1 10.5L14.2 15.2L10 12.7L5.8 15.2L6.9 10.5L3.2 7.4L8 7L10 2.5Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>';
    if(cat==='comedor')return '<svg viewBox="0 0 20 20" fill="none"><path d="M5 3V9M7 3V9M6 9V17M14 3V17M12.5 3V8C12.5 9.1 13.2 10 14 10" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>';
    if(cat==='evento')return '<svg viewBox="0 0 20 20" fill="none"><rect x="3" y="4" width="14" height="13" rx="2" stroke="currentColor" stroke-width="1.4"/><path d="M3 8H17M6.5 2.5V5.5M13.5 2.5V5.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>';
    return '<svg viewBox="0 0 20 20" fill="none"><rect x="3" y="4" width="14" height="13" rx="2" stroke="currentColor" stroke-width="1.4"/><path d="M6 2.5V5M14 2.5V5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>';
  }
  function dashCategoryLabel(cat){
    return cat==='examen'?'Examen':cat==='feriado'?'Feriado nacional':cat==='comedor'?'Comedor':'Evento académico';
  }
  function renderDashboardActivities(){
    const list=dashPickActivities();
    if(!list.length){activitiesBody.innerHTML='<div class="empty-state"><p>No hay actividades próximas.</p></div>';return;}
    activitiesBody.innerHTML='<div class="activities-list">'+list.map((ev,i)=>{
      const date= dashFmtDate(ev.dateISO||ev.date);
      const meta=ev.time?`${date} · ${dashClock(ev)}`:date;
      const name=ev.cat==='examen' ? (ev.name+' — '+ev.course) : ev.title;
      const extra=ev.cat==='examen' ? ('Comisión '+(ev.com||'—')) : (ev.cat==='feriado'?'Sin actividades académicas':'');
      return `<button type="button" class="activity-item" data-activity-index="${i}">
        <span class="activity-icon ${ev.cat}">${dashActivityIcon(ev.cat)}</span>
        <span class="activity-main">
          <span class="activity-top"><span class="activity-type ${ev.cat}">${dashCategoryLabel(ev.cat)}</span></span>
          <p class="activity-name">${name}</p>
          <p class="activity-meta">${meta}</p>
          ${extra?`<p class="activity-extra">${extra}</p>`:''}
        </span>
        <svg class="chev" viewBox="0 0 20 20" fill="none"><path d="M7.5 4.5L13 10L7.5 15.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>`;
    }).join('')+'</div>';
    activitiesBody.querySelectorAll('.activity-item').forEach(btn=>{
      btn.addEventListener('click',()=>openDashboardActivityModal(list[Number(btn.dataset.activityIndex)]));
    });
  }
  function dashModalRow(label,value){
    return `<div class="dashboard-modal-row"><span class="lbl">${label}</span><span class="val">${value||'—'}</span></div>`;
  }
  function openDashboardActivityModal(ev){
    const backdrop=document.getElementById('dashboardActivityModal');
    const kicker=document.getElementById('dashboardModalKicker');
    const title=document.getElementById('dashboardModalTitle');
    const body=document.getElementById('dashboardModalBody');
    const footer=document.getElementById('dashboardModalFooter');
    kicker.className='dashboard-modal-kicker '+ev.cat;
    kicker.textContent=dashCategoryLabel(ev.cat);
    title.textContent=ev.cat==='examen' ? (ev.name+' — '+ev.course) : ev.title;
    let rows='';
    if(ev.cat==='examen'){
      rows=dashModalRow('Fecha',dashFmtDate(ev.dateISO||ev.date))
        +dashModalRow('Horario',dashClock(ev))
        +dashModalRow('Sede',ev.sede)
        +dashModalRow('Aula',ev.room)
        +dashModalRow('Comisión',ev.com)
        +dashModalRow('Tipo',ev.tipo||ev.name);
      footer.innerHTML='<button type="button" class="btn-primary" id="dashboardVerExamen">Ver examen</button>';
      document.getElementById('dashboardVerExamen').onclick=()=>openDashboardExam(ev);
    } else if(ev.cat==='feriado'){
      rows=dashModalRow('Fecha',dashFmtDate(ev.dateISO||ev.date));
      footer.innerHTML='';
    } else if(ev.cat==='evento'){
      rows=dashModalRow('Fecha',dashFmtDate(ev.dateISO||ev.date));
      footer.innerHTML='';
    } else if(ev.cat==='comedor'){
      rows=dashModalRow('Fecha',dashFmtDate(ev.dateISO||ev.date))
        +dashModalRow('Horario',dashClock(ev))
        +dashModalRow('Ubicación',ev.ubicacion||'Belgrano');
      footer.innerHTML='';
    }
    body.innerHTML=rows;
    backdrop.classList.add('show');
  }
  function closeDashboardActivityModal(){
    document.getElementById('dashboardActivityModal').classList.remove('show');
  }
  document.getElementById('dashboardActivityModal')?.addEventListener('click',e=>{
    if(e.target.id==='dashboardActivityModal')closeDashboardActivityModal();
  });
  document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDashboardActivityModal();});
  function openDashboardExam(ev){
    let resolved=null, rawId=String(ev.examSourceId??String(ev.id).replace(/^session-exam-/, '').replace(/^fixed-exam-/, ''));
    try{
      const arr=JSON.parse(sessionStorage.getItem('uadenetSessionExams')||'[]');
      resolved=arr.find(x=>String(x.id)===rawId)||null;
      if(!resolved) resolved=arr.find(x=>String(x.course||'').toLowerCase()===String(ev.course||'').toLowerCase() &&
        dashCanonicalExamType(x)===dashCanonicalExamType(ev))||null;
    }catch(_ ){}
    if(!resolved){
      const f=DASH_FIXED_EXAMS.find(x=>String(x.id)===rawId);
      if(f)resolved={...f};
    }
    if(!resolved)resolved={...ev};
    const selected={...ev,...resolved,id:resolved.id??ev.examSourceId??ev.id,
      course:resolved.course||ev.course,name:resolved.name||ev.name,type:resolved.type||ev.type,
      dateISO:resolved.dateISO||ev.dateISO||dashParseDate(resolved.date||ev.date),
      startTime:resolved.startTime||ev.time||'',endTime:resolved.endTime||ev.end||'',
      location:resolved.location||ev.sede||'',room:resolved.room||ev.room||'',
      com:resolved.com||ev.com||'',period:resolved.period||(DASH_COURSE_META[ev.course]||{}).period||''};
    try{
      sessionStorage.setItem('uadenetSelectedExam',JSON.stringify(selected));
      sessionStorage.setItem('uadenetSelectedExamId',String(selected.id));
      const ids={'Desarrollo de Aplicaciones II':'da2','Ingeniería de Datos I':'id1','Ingeniería de Software':'isw','Programación II':'pr2','Redes de Datos':'rd','Programación I':'pr1','Tecnología e Innovación':'bd','Modelado y Simulación':'mys'};
      let cid=ids[selected.course];
      if(!cid){try{const cs=JSON.parse(sessionStorage.getItem('uadenetCreatedCourses')||'[]');const c=cs.find(x=>String(x.id)===String(selected.courseId)||x.name===selected.course);if(c)cid=c.id;}catch(_ ){}}
      if(cid){
        sessionStorage.setItem('uadenetSelectedCourse',String(cid));
        localStorage.setItem('uadenetSelectedCourse',String(cid));
      }
      const meta=DASH_COURSE_META[selected.course]||{};
      localStorage.setItem('uadenetSelectedCourseData',JSON.stringify({id:cid||selected.course,name:selected.course,com:selected.com||meta.com||'',period:selected.period||meta.period||'',sede:selected.sede||selected.location||meta.sede||'',room:selected.room||meta.room||''}));
    }catch(_ ){}
    closeDashboardActivityModal();
    __uadenetGo('pantalla-12-detalle-examen');
  }

  const activitiesBody = document.getElementById('activitiesBody');
  const summaryGrid = document.getElementById('summaryGrid');
  const notifDot = document.getElementById('notifDot');

  const activitiesOriginal = activitiesBody.innerHTML;
  const summaryOriginal = summaryGrid.innerHTML;

  function skeletonSummary(){
    let html='';
    for(let i=0;i<1;i++){
      html += `<div class="summary-card" style="cursor:default;">
        <div class="skel" style="width:38px;height:38px;border-radius:10px;"></div>
        <div class="skel" style="width:50%;height:22px;"></div>
        <div class="skel" style="width:70%;height:12px;"></div>
      </div>`;
    }
    return html;
  }
  function skeletonList(rows){
    let html='';
    for(let i=0;i<rows;i++){
      html += `<div style="display:flex;gap:12px;align-items:center;padding:12px 10px;">
        <div class="skel" style="width:38px;height:38px;border-radius:9px;flex-shrink:0;"></div>
        <div style="flex:1;display:flex;flex-direction:column;gap:6px;">
          <div class="skel" style="width:70%;height:12px;"></div>
          <div class="skel" style="width:45%;height:11px;"></div>
        </div>
      </div>`;
    }
    return html;
  }

  function setState(name){
    // reset
    summaryGrid.innerHTML = summaryOriginal;
    renderDashboardActivities();
    if(notifDot) notifDot.style.display = 'block';

    if(name === 'loading'){
      summaryGrid.innerHTML = skeletonSummary();
      activitiesBody.innerHTML = skeletonList(3);
    } else if(name === 'emptyActivities'){
      activitiesBody.innerHTML = `<div class="empty-state">
        <svg viewBox="0 0 20 20" fill="none"><rect x="3" y="4" width="14" height="13" rx="2" stroke="currentColor" stroke-width="1.3"/><path d="M3 8H17" stroke="currentColor" stroke-width="1.3"/></svg>
        <p>No hay actividades próximas.</p>
      </div>`;
    } else if(name === 'emptyNotifs'){
      if(notifDot) notifDot.style.display = 'none';
    } else if(name === 'errorActivities'){
      activitiesBody.innerHTML = `<div class="error-state">
        <svg viewBox="0 0 20 20" fill="none"><path d="M10 6.5V10.5M10 14H10.01M18 10C18 14.4183 14.4183 18 10 18C5.58172 18 2 14.4183 2 10C2 5.58172 5.58172 2 10 2C14.4183 2 18 5.58172 18 10Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <p>No pudimos cargar esta información.</p>
        <button class="retry-btn" onclick="setState('normal')">Reintentar</button>
      </div>`;
    } else if(name === 'noNotifDot'){
      notifDot.style.display = 'none';
    }
  }
  renderDashboardActivities();

  // sessionStorage no dispara el evento 'storage' entre páginas de la misma pestaña.
  // El Inicio se refresca periódicamente para que crear/editar/cancelar un examen
  // actualice automáticamente las cuatro actividades sin necesitar datos duplicados.
  let lastActivitiesSignature = '';
  function refreshDashboardActivitiesIfNeeded(){
    const list = dashPickActivities();
    const signature = list.map(e => `${e.id}|${dashEventTimestamp(e)}|${e.cat}|${e.name||e.title}`).join('||');
    if(signature !== lastActivitiesSignature){
      lastActivitiesSignature = signature;
      renderDashboardActivities();
    }
  }
  lastActivitiesSignature = dashPickActivities().map(e => `${e.id}|${dashEventTimestamp(e)}|${e.cat}|${e.name||e.title}`).join('||');
  window.addEventListener('pageshow', refreshDashboardActivitiesIfNeeded);
  window.addEventListener('focus', refreshDashboardActivitiesIfNeeded);
  setInterval(refreshDashboardActivitiesIfNeeded, 1000);
</script>

<script>
(function(){
  function closeAllUserMenus(except){
    document.querySelectorAll('.user-dropdown.open').forEach(function(menu){
      if(menu !== except) menu.classList.remove('open');
    });
    document.querySelectorAll('.user-menu.active-menu').forEach(function(btn){
      if(!except || btn.parentElement.querySelector('.user-dropdown') !== except){
        btn.classList.remove('active-menu');
      }
    });
  }

  window.toggleUserMenu = function(button){
    var wrap = button.closest('.user-menu-wrap');
    var menu = wrap ? wrap.querySelector('.user-dropdown') : null;
    if(!menu) return;
    var willOpen = !menu.classList.contains('open');
    closeAllUserMenus(menu);
    menu.classList.toggle('open', willOpen);
    button.classList.toggle('active-menu', willOpen);
  };

  document.addEventListener('click', function(e){
    if(!e.target.closest('.user-menu-wrap')){
      closeAllUserMenus(null);
    }
  });
})();
</script>
