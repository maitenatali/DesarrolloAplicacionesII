# Sirve el build de React y hace de "gateway" local: mismas rutas que el proxy de Vite.
server {
  listen 80;
  root /usr/share/nginx/html;

  # Portal Docente: /api/v1/teacher/* -> teacher-service /api/v1/*
  location /api/v1/teacher/ {
    proxy_pass http://api:8080/api/v1/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  # CORE (en esta entrega lo sirve el simulador dentro del mismo backend)
  location /api/v1/ {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location /.well-known/ {
    proxy_pass http://api:8080;
  }
  # SPA: cualquier otra ruta la resuelve React Router
  location / {
    try_files $uri /index.html;
  }
}
