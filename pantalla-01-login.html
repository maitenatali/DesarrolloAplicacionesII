<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UADEnet — Portal del Docente | Iniciar sesión</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-950:#10192f;
    --navy-900:#1b2a4a;
    --navy-800:#26375c;
    --navy-600:#4a5c82;
    --navy-100:#e8ecf5;
    --gold-500:#c9a24b;
    --gold-600:#ab8437;
    --gold-100:#f4ead2;
    --bg:#f6f7fa;
    --surface:#ffffff;
    --text-900:#16213a;
    --text-600:#5b6472;
    --text-400:#8992a3;
    --border:#dde2ea;
    --border-focus:var(--navy-800);
    --error-600:#b3392c;
    --error-100:#fbeae7;
    --success-600:#2f7a4f;
    --radius-lg:16px;
    --radius-md:10px;
    --radius-sm:7px;
    --shadow-card:0 24px 60px -20px rgba(16,25,47,0.28), 0 2px 8px rgba(16,25,47,0.06);
    --font-display:'Source Serif 4', Georgia, serif;
    --font-body:'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:var(--font-body);
    color:var(--text-900);
    background:var(--bg);
    -webkit-font-smoothing:antialiased;
  }

  .screen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 20px;
    position:relative;
    overflow:hidden;
    background:
      radial-gradient(1100px 620px at 12% -10%, rgba(27,42,74,0.05), transparent 60%),
      radial-gradient(900px 560px at 108% 108%, rgba(201,162,75,0.10), transparent 60%),
      var(--bg);
  }

  /* signature element: faint network / node graphic evoking "net" in UADEnet */
  .net-motif{
    position:absolute;
    inset:0;
    pointer-events:none;
    opacity:0.55;
  }
  .net-motif svg{width:100%;height:100%;}

  .login-card{
    position:relative;
    z-index:1;
    width:100%;
    max-width:428px;
    background:var(--surface);
    border-radius:var(--radius-lg);
    box-shadow:var(--shadow-card);
    padding:44px 40px 36px;
    border:1px solid rgba(16,25,47,0.04);
  }

  .brand{
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    margin-bottom:30px;
  }

  .brand-mark{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:22px;
    cursor:pointer;
    background:none;
    border:none;
    padding:2px;
  }
  .brand-mark:focus-visible{outline:2px solid var(--navy-800); outline-offset:4px; border-radius:6px;}

  .brand-glyph{
    width:34px;height:34px;
    border-radius:8px;
    background:linear-gradient(155deg, var(--navy-900), var(--navy-950));
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .brand-glyph svg{width:18px;height:18px;}

  .brand-word{
    font-family:var(--font-display);
    font-weight:600;
    font-size:22px;
    letter-spacing:0.01em;
    color:var(--navy-950);
  }
  .brand-word .accent{color:var(--gold-600);}

  .title{
    font-family:var(--font-display);
    font-weight:600;
    font-size:26px;
    line-height:1.25;
    color:var(--text-900);
    margin:0 0 8px;
  }

  .subtitle{
    font-size:14.5px;
    color:var(--text-600);
    margin:0;
    line-height:1.5;
  }

  form{margin-top:8px;}

  .field{
    margin-bottom:18px;
  }

  .field label{
    display:block;
    font-size:13px;
    font-weight:600;
    color:var(--text-900);
    margin-bottom:7px;
  }

  .input-wrap{
    position:relative;
    display:flex;
    align-items:center;
  }

  .input-wrap .leading-icon{
    position:absolute;
    left:14px;
    width:18px;height:18px;
    color:var(--text-400);
    pointer-events:none;
    display:flex;
  }

  input[type="email"],
  input[type="password"],
  input[type="text"]{
    width:100%;
    font-family:var(--font-body);
    font-size:14.5px;
    color:var(--text-900);
    background:var(--surface);
    border:1.5px solid var(--border);
    border-radius:var(--radius-md);
    padding:12px 14px 12px 42px;
    transition:border-color .15s ease, box-shadow .15s ease, background .15s ease;
    outline:none;
  }
  input::placeholder{color:var(--text-400);}

  input:hover:not(:disabled){border-color:var(--navy-600);}

  input:focus{
    border-color:var(--border-focus);
    box-shadow:0 0 0 3.5px rgba(27,42,74,0.12);
  }

  input:disabled{
    background:#f1f2f5;
    color:var(--text-400);
    cursor:not-allowed;
  }

  input.has-error{
    border-color:var(--error-600);
    background:var(--error-100);
  }
  input.has-error:focus{box-shadow:0 0 0 3.5px rgba(179,57,44,0.14);}

  .password-wrap input{padding-right:44px;}

  .toggle-visibility{
    position:absolute;
    right:6px;
    width:32px;height:32px;
    display:flex;align-items:center;justify-content:center;
    background:none;
    border:none;
    border-radius:7px;
    color:var(--text-600);
    cursor:pointer;
  }
  .toggle-visibility:hover{background:var(--navy-100); color:var(--navy-900);}
  .toggle-visibility:focus-visible{outline:2px solid var(--navy-800); outline-offset:1px;}
  .toggle-visibility svg{width:18px;height:18px;}

  .field-error{
    display:none;
    align-items:center;
    gap:6px;
    margin-top:7px;
    font-size:12.5px;
    color:var(--error-600);
    font-weight:500;
  }
  .field-error svg{width:14px;height:14px;flex-shrink:0;}
  .field.error .field-error{display:flex;}

  .row-between{
    display:flex;
    justify-content:flex-end;
    margin:-6px 0 20px;
  }

  .link{
    font-size:13px;
    font-weight:600;
    color:var(--navy-800);
    text-decoration:none;
    border-bottom:1px solid transparent;
    transition:border-color .15s ease, color .15s ease;
  }
  .link:hover{border-color:var(--navy-800);}
  .link:focus-visible{outline:2px solid var(--navy-800); outline-offset:3px; border-radius:3px;}

  .form-alert{
    display:none;
    align-items:flex-start;
    gap:9px;
    background:var(--error-100);
    border:1px solid rgba(179,57,44,0.25);
    color:var(--error-600);
    font-size:13px;
    font-weight:500;
    line-height:1.45;
    padding:11px 13px;
    border-radius:var(--radius-sm);
    margin-bottom:18px;
  }
  .form-alert.show{display:flex;}
  .form-alert svg{width:16px;height:16px;flex-shrink:0;margin-top:1px;}

  .btn-primary{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:9px;
    font-family:var(--font-body);
    font-size:15px;
    font-weight:600;
    color:#fff;
    background:var(--navy-900);
    border:none;
    border-radius:var(--radius-md);
    padding:13px 16px;
    cursor:pointer;
    transition:background .15s ease, transform .05s ease, box-shadow .15s ease;
    box-shadow:0 1px 2px rgba(16,25,47,0.06);
  }
  .btn-primary:hover:not(:disabled){background:var(--navy-800);}
  .btn-primary:active:not(:disabled){transform:translateY(1px);}
  .btn-primary:focus-visible{outline:2px solid var(--gold-600); outline-offset:2px;}
  .btn-primary:disabled{
    background:var(--navy-600);
    cursor:not-allowed;
    opacity:.75;
  }

  .spinner{
    width:16px;height:16px;
    border:2px solid rgba(255,255,255,0.35);
    border-top-color:#fff;
    border-radius:50%;
    animation:spin .7s linear infinite;
    display:none;
  }
  .btn-primary.loading .spinner{display:inline-block;}
  .btn-primary.loading .btn-label::after{content:"Iniciando sesión…";}
  .btn-primary.loading .btn-label{font-size:0;}
  .btn-primary.loading .btn-label::after{font-size:15px;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .foot-note{
    text-align:center;
    font-size:12.5px;
    color:var(--text-400);
    margin-top:26px;
  }

  .state-controls{
    position:fixed;
    bottom:16px;
    left:50%;
    transform:translateX(-50%);
    z-index:2;
    display:flex;
    gap:6px;
    background:rgba(16,25,47,0.92);
    padding:8px;
    border-radius:10px;
    flex-wrap:wrap;
    justify-content:center;
    max-width:92vw;
  }
  .state-controls button{
    font-family:var(--font-body);
    font-size:11.5px;
    font-weight:600;
    color:#e8ecf5;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.14);
    border-radius:6px;
    padding:6px 10px;
    cursor:pointer;
  }
  .state-controls button:hover{background:rgba(255,255,255,0.18);}
  .state-controls span{
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:rgba(232,236,245,0.55);
    align-self:center;
    padding-right:2px;
  }

  @media (max-width:520px){
    .screen{padding:20px 14px 96px;}
    .login-card{padding:32px 22px 28px; border-radius:14px;}
    .title{font-size:22px;}
    .state-controls{bottom:10px;}
  }
</style>
</head>
<body>

<div class="screen">
  <div class="net-motif" aria-hidden="true">
    <svg viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice">
      <g stroke="#1b2a4a" stroke-width="1" opacity="0.16">
        <line x1="80" y1="120" x2="300" y2="240"/>
        <line x1="300" y1="240" x2="220" y2="420"/>
        <line x1="300" y1="240" x2="500" y2="180"/>
        <line x1="220" y1="420" x2="60" y2="520"/>
        <line x1="1360" y1="760" x2="1180" y2="640"/>
        <line x1="1180" y1="640" x2="1260" y2="470"/>
        <line x1="1180" y1="640" x2="980" y2="700"/>
        <line x1="1260" y1="470" x2="1400" y2="380"/>
      </g>
      <g fill="#c9a24b" opacity="0.5">
        <circle cx="80" cy="120" r="3.5"/>
        <circle cx="300" cy="240" r="3.5"/>
        <circle cx="220" cy="420" r="3.5"/>
        <circle cx="500" cy="180" r="3.5"/>
        <circle cx="60" cy="520" r="3.5"/>
        <circle cx="1360" cy="760" r="3.5"/>
        <circle cx="1180" cy="640" r="3.5"/>
        <circle cx="1260" cy="470" r="3.5"/>
        <circle cx="980" cy="700" r="3.5"/>
        <circle cx="1400" cy="380" r="3.5"/>
      </g>
    </svg>
  </div>

  <main class="login-card" role="main">
    <div class="brand">
      <button class="brand-mark" type="button" aria-label="UADEnet — ir al inicio" onclick="return false;">
        <span class="brand-glyph">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 3L21 8V16L12 21L3 16V8L12 3Z" stroke="#f4ead2" stroke-width="1.4" stroke-linejoin="round"/>
            <path d="M12 3V21M3 8L12 13L21 8M3 16L12 11" stroke="#f4ead2" stroke-width="1.1" stroke-linejoin="round" opacity="0.8"/>
          </svg>
        </span>
        <span class="brand-word">UADE<span class="accent">net</span></span>
      </button>
      <h1 class="title">Portal del Docente</h1>
      <p class="subtitle">Ingresá con tu cuenta institucional</p>
    </div>

    <div class="form-alert" id="formAlert" role="alert">
      <svg viewBox="0 0 20 20" fill="none"><path d="M10 6.5V10.5M10 14H10.01M18 10C18 14.4183 14.4183 18 10 18C5.58172 18 2 14.4183 2 10C2 5.58172 5.58172 2 10 2C14.4183 2 18 5.58172 18 10Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>El email o la contraseña son incorrectos.</span>
    </div>

    <form id="loginForm" novalidate>
      <div class="field" id="emailField">
        <label for="email">Email institucional</label>
        <div class="input-wrap">
          <span class="leading-icon">
            <svg viewBox="0 0 20 20" fill="none"><path d="M2.5 5.5L9.15 10.2C9.66 10.56 10.34 10.56 10.85 10.2L17.5 5.5M4 15.5H16C16.83 15.5 17.5 14.83 17.5 14V6C17.5 5.17 16.83 4.5 16 4.5H4C3.17 4.5 2.5 5.17 2.5 6V14C2.5 14.83 3.17 15.5 4 15.5Z" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span>
          <input type="email" id="email" name="email" placeholder="Ingresá tu email" autocomplete="username">
        </div>
        <div class="field-error">
          <svg viewBox="0 0 20 20" fill="none"><path d="M10 6.5V10.5M10 14H10.01M18 10C18 14.4183 14.4183 18 10 18C5.58172 18 2 14.4183 2 10C2 5.58172 5.58172 2 10 2C14.4183 2 18 5.58172 18 10Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>Ingresá un email institucional válido.</span>
        </div>
      </div>

      <div class="field" id="passwordField">
        <label for="password">Contraseña</label>
        <div class="input-wrap password-wrap">
          <span class="leading-icon">
            <svg viewBox="0 0 20 20" fill="none"><path d="M5 9V6.5C5 4.01 7.01 2 9.5 2C11.99 2 14 4.01 14 6.5V9M4.5 9H14.5C15.6 9 16.5 9.9 16.5 11V16C16.5 17.1 15.6 18 14.5 18H4.5C3.4 18 2.5 17.1 2.5 16V11C2.5 9.9 3.4 9 4.5 9Z" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span>
          <input type="password" id="password" name="password" placeholder="Ingresá tu contraseña" autocomplete="current-password">
          <button type="button" class="toggle-visibility" id="toggleVisibility" aria-label="Mostrar contraseña" aria-pressed="false">
            <svg viewBox="0 0 20 20" fill="none" id="eyeIcon"><path d="M1.5 10S4.5 4 10 4s8.5 6 8.5 6-3 6-8.5 6-8.5-6-8.5-6Z" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="10" cy="10" r="2.3" stroke="currentColor" stroke-width="1.4"/></svg>
          </button>
        </div>
        <div class="field-error">
          <svg viewBox="0 0 20 20" fill="none"><path d="M10 6.5V10.5M10 14H10.01M18 10C18 14.4183 14.4183 18 10 18C5.58172 18 2 14.4183 2 10C2 5.58172 5.58172 2 10 2C14.4183 2 18 5.58172 18 10Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>La contraseña es obligatoria.</span>
        </div>
      </div>

      <div class="row-between">
        <a href="#" class="link" id="forgotLink">¿Olvidaste tu contraseña?</a>
      </div>

      <button type="submit" class="btn-primary" id="submitBtn">
        <span class="spinner"></span>
        <span class="btn-label">Iniciar sesión</span>
      </button>
    </form>

    <p class="foot-note">© 2026 Universidad Argentina de la Empresa</p>
  </main>
</div>

<script>
  const emailField = document.getElementById('emailField');
  const passwordField = document.getElementById('passwordField');
  const emailInput = document.getElementById('email');
  const passwordInput = document.getElementById('password');
  const formAlert = document.getElementById('formAlert');
  const submitBtn = document.getElementById('submitBtn');
  const form = document.getElementById('loginForm');
  const toggleBtn = document.getElementById('toggleVisibility');
  const eyeIcon = document.getElementById('eyeIcon');
  const forgotLink = document.getElementById('forgotLink');

  function clearStates(){
    emailField.classList.remove('error');
    passwordField.classList.remove('error');
    emailInput.classList.remove('has-error');
    passwordInput.classList.remove('has-error');
    formAlert.classList.remove('show');
    submitBtn.classList.remove('loading');
    submitBtn.disabled = false;
    emailInput.disabled = false;
    passwordInput.disabled = false;
  }

  function setState(name){
    clearStates();
    if(name === 'emailError'){
      emailField.classList.add('error');
      emailInput.classList.add('has-error');
      emailInput.focus();
    } else if(name === 'passwordError'){
      passwordField.classList.add('error');
      passwordInput.classList.add('has-error');
    } else if(name === 'authError'){
      formAlert.classList.add('show');
    } else if(name === 'loading'){
      submitBtn.classList.add('loading');
      submitBtn.disabled = true;
      emailInput.disabled = true;
      passwordInput.disabled = true;
    } else if(name === 'disabled'){
      submitBtn.disabled = true;
    }
  }

  function isInstitutionalEmail(value){
    return /^[^\s@]+@uade\.edu\.ar$/i.test(value.trim());
  }

  toggleBtn.addEventListener('click', () => {
    const isPassword = passwordInput.type === 'password';
    passwordInput.type = isPassword ? 'text' : 'password';
    toggleBtn.setAttribute('aria-pressed', String(isPassword));
    toggleBtn.setAttribute('aria-label', isPassword ? 'Ocultar contraseña' : 'Mostrar contraseña');
    eyeIcon.innerHTML = isPassword
      ? '<path d="M2.5 2.5L17.5 17.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M8.3 8.4A2.3 2.3 0 0 0 10 12.3c.6 0 1.15-.22 1.57-.58M5.6 5.7C3.4 7.1 1.5 10 1.5 10s3 6 8.5 6c1.5 0 2.83-.42 3.97-1.05M15.9 13.9C17.4 12.6 18.5 10 18.5 10s-1.2-2.4-3.3-4.2M11.7 4.2C11.15 4.07 10.58 4 10 4c-.5 0-.98.05-1.44.14" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>'
      : '<path d="M1.5 10S4.5 4 10 4s8.5 6 8.5 6-3 6-8.5 6-8.5-6-8.5-6Z" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="10" cy="10" r="2.3" stroke="currentColor" stroke-width="1.4"/>';
  });

  forgotLink.addEventListener('click', (e) => {
    e.preventDefault();
    // Si la pantalla está integrada en el visor de UADEnet, le pide al shell
    // que navegue a la pantalla de recuperación de contraseña.
    if (window.parent && window.parent !== window) {
      window.parent.postMessage({ type: 'uadenet-navigate', screen: 'pantalla-01b-recuperar-contrasena' }, '*');
    } else {
      __uadenetGo('pantalla-01b-recuperar-contrasena');
    }
  });

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    clearStates();

    let hasError = false;
    if(!isInstitutionalEmail(emailInput.value)){
      emailField.classList.add('error');
      emailInput.classList.add('has-error');
      hasError = true;
    }
    if(!passwordInput.value){
      passwordField.classList.add('error');
      passwordInput.classList.add('has-error');
      hasError = true;
    }
    if(hasError){
      (emailField.classList.contains('error') ? emailInput : passwordInput).focus();
      return;
    }

    submitBtn.classList.add('loading');
    submitBtn.disabled = true;
    emailInput.disabled = true;
    passwordInput.disabled = true;

    // Simulación de autenticación — a integrar con el backend real.
    setTimeout(() => {
      const demoCredentialsAreValid = emailInput.value.toLowerCase() === 'mariana.gomez@uade.edu.ar' && passwordInput.value === 'demo1234';
      if(demoCredentialsAreValid){
        submitBtn.querySelector('.btn-label').textContent = 'Redirigiendo…';
        // Si la pantalla está integrada en el visor de UADEnet, le pide al shell
        // que navegue al dashboard. Si se abre suelta, no hay a dónde navegar.
        setTimeout(() => {
          if (window.parent && window.parent !== window) {
            window.parent.postMessage({ type: 'uadenet-navigate', screen: 'pantalla-02-dashboard' }, '*');
          } else {
            __uadenetGo('pantalla-02-dashboard');
          }
        }, 500);
      } else {
        clearStates();
        formAlert.classList.add('show');
      }
    }, 1400);
  });
</script>


<script>
  // Puente de navegación integrado: todos los enlaces de una vista pasan por el visor principal.
  (function(){
    const NAV_ALIASES = {"pantalla-10-cargar-calificacion":"pantalla-09-calificaciones","pantalla-11-examenes":"pantalla-10-examenes","pantalla-12-formulario-examen":"pantalla-11-formulario-examen","pantalla-13-detalle-examen":"pantalla-12-detalle-examen","pantalla-14-resultados-examen":"pantalla-12-detalle-examen","pantala-20-notificaciones":"pantalla-20-notificaciones","componente-28-menu-usuario":"pantalla-27-perfil-docente","componente-29-centro-notificaciones":"pantalla-20-notificaciones"};
    window.__uadenetGo = function(slug){
      slug = NAV_ALIASES[slug] || slug;
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({ type:'uadenet-navigate', screen:slug }, '*');
      } else {
        console.log('Navegar a: ' + slug);
      }
    };
  })();
</script>

<script>
