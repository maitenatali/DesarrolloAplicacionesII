[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "teacher-service"
version = "0.1.0"
description = "Portal Docente (UADEnet) - teacher microservice"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.0,<4",
    "sqlalchemy>=2.0,<3",
    "flask-sqlalchemy>=3.1,<4",
    "flask-migrate>=4.0,<5",
    "psycopg[binary]>=3.1,<4",
    "pydantic>=2.5,<3",
    "spectree>=1.2",
    "pyjwt[crypto]>=2.8,<3",
    "requests>=2.31,<3",
    "cachetools>=5.3",
    "gunicorn>=22",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "freezegun>=1.4",
    "requests-mock>=1.11",
    "ruff>=0.5",
    "mypy>=1.10",
    "testcontainers[postgresql]>=4.4",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DTZ"]
ignore = ["B008", "E501"]

[tool.ruff.lint.per-file-ignores]
"app/time.py" = ["DTZ"]
"tests/*" = ["DTZ"]
"migrations/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
